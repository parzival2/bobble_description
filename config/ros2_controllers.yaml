controller_manager:
  ros__parameters:
    update_rate: 500  # Hz — matches balance controller rate
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    effort_controller:
      type: forward_command_controller/ForwardCommandController

effort_controller:
  ros__parameters:
    joints:
      - left_wheel_hinge
      - right_wheel_hinge
    interface_name: effort

joint_state_broadcaster:
  ros__parameters: {}
